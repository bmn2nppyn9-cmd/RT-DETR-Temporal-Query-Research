[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rtdetr-query-infra"
version = "0.1.0"
description = "Local experiment orchestration and performance evidence for stateful RT-DETR"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
evaluation = ["numpy>=1.26,<3", "pycocotools>=2.0.7"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.urls]
Repository = "https://github.com/bmn2nppyn9-cmd/RT-DETR-Temporal-Query-Research"

[project.scripts]
tqinfra = "tqinfra.cli:main"

[tool.setuptools]
packages = ["tqinfra"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
